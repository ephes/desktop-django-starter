[package]
name = "desktop-django-starter-tauri"
version = "0.1.0"
description = "Experimental Tauri shell for desktop-django-starter."
authors = ["Desktop Django Starter contributors"]
edition = "2021"

[lib]
name = "desktop_django_starter_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
url = "2.5.8"
