name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shells/electron/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # CI intentionally runs on 3.13 while the project floor stays at 3.12
          # and RTD uses 3.12.
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Install Electron dependencies
        run: npm --prefix shells/electron ci

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        shell: bash
        run: |
          uv run --locked mypy src/
          for f in shells/electron/main.js shells/electron/preload.cjs shells/electron/electron-builder.config.cjs shells/electron/scripts/*.cjs scripts/*.cjs shells/tauri/scripts/*.mjs; do node --check "$f" || exit 1; done

      - name: Run tests
        run: uv run pytest

      - name: Run Electron Node-side tests
        run: npm --prefix shells/electron test

      - name: Stage CLI assets
        run: uv run python cli/sync_assets.py

      - name: Run CLI tests
        working-directory: cli
        run: uv run --with pytest python -m pytest tests/

      - name: Build docs
        run: uv run sphinx-build -M html docs docs/_build
